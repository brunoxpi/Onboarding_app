<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Onboarding WhatsApp · ANOVA</title>
<link rel="stylesheet" href="anova/colors_and_type.css">
<style>
  html, body { height: 100%; background: #EFE7DE; }
  body {
    font-family: var(--font);
    color: #111B21;
    min-height: 100vh;
    overflow: hidden;
    margin: 0;
  }
  #root { width: 100%; height: 100vh; }

  /* Mobile-first: chat fills the screen */
  .stage {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    background: #EFE7DE;
    position: relative;
  }

  /* Desktop / large viewports: center the chat in a mobile-sized column with neutral surroundings */
  @media (min-width: 760px) and (min-height: 720px) {
    body { background: #d8cfc2; }
    .stage {
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .device-shell {
      width: 420px;
      height: min(820px, calc(100vh - 48px));
      background: #EFE7DE;
      box-shadow: 0 12px 40px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
      border-radius: 14px;
      overflow: hidden;
      display: flex; flex-direction: column;
      flex-shrink: 0;
    }
    .device-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  }
  @media (max-width: 759px), (max-height: 719px) {
    .device-shell { display: contents; }
    .device-screen { display: contents; }
  }

  /* Floating reset chip — small, top-right, doesn't interfere with chat */
  .reset-btn {
    position: fixed; top: 14px; right: 14px; z-index: 100;
    appearance: none; border: 0.5px solid rgba(17,27,33,.18);
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #54656F;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 7px 11px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: all 160ms ease;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .reset-btn:hover { background: #fff; color: #008069; border-color: rgba(0,128,105,.30); }
  .reset-btn svg { width: 11px; height: 11px; }

  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #54656F;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div id="root"><div class="loading">Carregando · ANOVA</div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="mocks.jsx"></script>
  <script type="text/babel" src="whatsapp.jsx"></script>
  <script type="text/babel" src="signup.jsx"></script>
  <script type="text/babel" src="identity.jsx"></script>
  <script type="text/babel" src="extras.jsx"></script>
  <script type="text/babel" src="chatlist.jsx"></script>
  <script type="text/babel" src="conversation.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
